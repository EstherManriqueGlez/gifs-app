<div id="logo" class="my-4 px-6 flex items-center justify-between">
  <div>
    <h1 class="text-lg md:text-2xl font-bold text-white">
      {{ envs.companyName }} <span class="text-blue-500">{{ envs.companyName2 }}</span>.
    </h1>
    <p class="text-slate-400 text-sm dark:text-slate-500">{{ envs.CompanySlogan }}</p>
  </div>
  <button
    (click)="toggleTheme()"
    class="p-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition-colors"
    [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    @if (themeService.isDark()) {
    <i class="fa-solid fa-sun text-lg"></i>
    } @else {
    <i class="fa-solid fa-moon text-lg"></i>
    }
  </button>
</div>

<div id="profile" class="px-6 py-8">
  <p class="text-slate-400 text-sm dark:text-slate-500">{{ greeting() }},</p>
  <a href="#" class="mt-2 inline-flex space-x-3 items-center group">
    <span
      class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-sm font-bold select-none"
    >
      {{ envs.profileInitials }}
    </span>
    <span class="flex flex-col">
      <span class="text-sm md:text-base font-bold text-white group-hover:text-blue-400 transition-colors">
        {{ envs.profileName }}
      </span>
      <span class="text-xs text-slate-500">View profile</span>
    </span>
  </a>
</div>
