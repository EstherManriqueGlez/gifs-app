<h2 class="text-2xl font-bold mt-5">Search Gifs</h2>
<h3 class="text-sm text-gray-500 dark:text-slate-400">Find your favorite gifs</h3>

<section class="flex flex-col gap-4">
  <input
    #txtSearch
    type="text"
    placeholder="Search a gifs..."
    class="mt-3 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    (keyup.enter)="onSearch(txtSearch.value)"
  />
</section>

<section class="py-5">
  @if (searching()) {
  <gif-list-skeleton />
  } @else {
  <gif-list [gifs]="gifs()" />
  }
</section>
